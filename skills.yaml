# Go skill registry
#
# See PROTOCOL.adoc.
#
# This is the source of truth for skills. It goes without saying, but do not
# update ladder state by hand. It's computed on demand by `cmd/reportgen`
# from `tests/*/`.
#
# Every skill is flat, independently scoreable, and stands on its own.
# Its label must be a complete, standalone claim.
#
# Label convention, borrowed from the CEFR (Common European Framework of
# Reference for Languages) "Can Do" descriptors used for language-proficiency
# levels (A1-C2), applied here to Go instead: every label reads "Can <verb>
# ...". A one-time, externally verifiable achievement (an OSS contribution, a
# language contribution) is still a skill, not a special case. Its
# evidence is a test whose attempt notes record what was checked (a URL,
# confirmed authorship and merge status), the same mechanism as everything
# else.
#
# `rubric` is a tiered pass bar, required on every skill: up to three
# one-sentence bars (orange/yellow/green) the agent grades an attempt
# against, top-down. `green` is always required; `orange`/`yellow` are
# optional and fill from the bottom (a skill can't define `yellow` without
# `orange`). A skill that's genuinely binary defines `green` alone. See
# "Skill registry" and "Skills are flat" in PROTOCOL.adoc for the full
# split-vs-tier principle: split a skill in two when it bundles two
# different commands, tier one skill when it's a depth gradient on the same
# command, and leave a skill single-tier otherwise.
#
# `level` is its own required field, not a category, since every skill needs
# exactly one and it drives `README.md`'s top-level sections.

levels: [Beginner, Intermediate, Proficient, Expert]

# This skill list is grounded in the resources below.
# Each reference tags the `topics` it covers, when available. Where a topic
# has no single canonical source, it is left uncited.
