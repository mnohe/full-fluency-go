# Go skill registry
#
# See PROTOCOL.adoc.
#
# This is the source of truth for skills and milestones.
# It goes without saying, but do not update by hand!
# Confidence values are computed on demand by
# `cmd/skillsgen` from `tests/*/scorecard.yaml`.
#
# Every skill is flat and independently scoreable.
# `categories` are just optional display metadata, and are computed by
# `cmd/skillsgen` as the *minimum* confidence among their member skills.
# `level` is its own required field, not a category, since every skill
# needs exactly one and it drives `README.md`'s top-level sections.
#
# The label conventions are borrowed from the CEFR
# (Common European Framework of Reference for Languages).
# `kind:skill` such as "Can <verb> ..." and  "Can Do" descriptors used
# for language-proficiency levels (A1-C2), applied here to Go instead.
# `kind:milestone` labels read "Has <past participle> ..." (a one-time
# completed event, not an ongoing ability). Skills grouped under a
# category (goroutines, net/http, memory model) are kept as bare nouns.

levels: [Beginner, Intermediate, Proficient, Expert]

# This skill list isn't arbitrary -- it's grounded in the resources below.
# Each reference tags the `topics` it covers rather than being pinned to one
# skill (most cover several at once, and forcing a single citation per skill
# would overstate the precision). Where a topic has no single canonical
# source (e.g. "design large-scale systems", "debug complex issues"), it's
# left uncited rather than force-fit to something that doesn't really cover
# it.
